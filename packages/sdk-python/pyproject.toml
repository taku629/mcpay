[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpay"
version = "0.1.0"
description = "Python SDK for monetizing MCP servers via MCPay"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "monetization", "stripe", "billing", "ai-agents"]
authors = [{ name = "MCPay contributors" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/taku629/mcpay"
Issues   = "https://github.com/taku629/mcpay/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcpay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
